[package]
name = "lym_cli"
version = "1.2.0"
edition = "2021"

[lib]
name = "lym_cli"
path = "./src/lib.rs"

[[bin]]
name = "lym"
path = "./src/main.rs"

[dependencies]
reqwest = { version = "0.11.24", default-features = false, features = ["rustls-tls", "json"] }
chrono = "0.4.33"
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
meval = "0.2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.21"
rand = "0.8"
clap = { version = "4.5.1", features = [
    "derive",
    "color",
    "suggestions",
    "wrap_help",
] }
